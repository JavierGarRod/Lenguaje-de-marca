<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="CSS/css.css">
</head>
<body>
  <form id="registro" novalidate>
  <h2>Formulario de Inscripción a la Maratón de Sevilla</h2>

  <label>Nombre:
    <input type="text" id="nombre" required>
    <span class="error"></span>
  </label>

  <label>Apellidos:
    <input type="text" id="apellidos" required>
    <span class="error"></span>
  </label>

  <label>Email:
    <input type="email" id="email" required>
    <span class="error"></span>
  </label>

  <label>Contraseña:
    <input type="password" id="password" required>
    <span class="error"></span>
  </label>

  <label>Repetir contraseña:
    <input type="password" id="password2" required>
    <span class="error"></span>
  </label>

  <label>Teléfono:
    <input type="tel" id="telefono" required>
    <span class="error"></span>
  </label>

  <label>Fecha de nacimiento:
    <input type="date" id="nacimiento" required>
    <span class="error"></span>
  </label>

  <label>Edad:
    <input type="number" id="edad"  min="1" max="120" required>
    <span class="error"></span>
  </label>

  <label>País:
    <select id="pais" required>
      <option value="">Seleccione...</option>
      <option>España</option>
      <option>México</option>
      <option>Argentina</option>
      <option>Colombia</option>
    </select>
    <span class="error"></span>
  </label>

  <label>Categoria:
    <input type="checkbox" name="junior" value="Junior"> Sub-20/Junior
    <input type="checkbox" name="senior" value="Senior"> Senior/Promesa
    <input type="checkbox" name="veterano" value="Veterano"> Máster/Veterano
    <input type="checkbox" name="absoluta" value="Categoria Absoluta"> Categoria Absoluta
    <span class="error"></span>
  </label>

  <label>Club:
    <textarea id="club" name="club" rows="4" cols="40" placeholder="Escribe a que club perteneces..."></textarea>
    <input type="checkbox" name="noclub" value="Noclub"> No pertenezco a ningun club
    <span class="error"></span>
  </label>

  <button type="submit">Enviar</button>
</form>
  <script src="JS/js1.js"></script>
</body>
</html>
