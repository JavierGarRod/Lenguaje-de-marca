<!DOCTYPE html>
<html lang="es">
<head>
    <title>Prueba T/P 2o Trimestre</title>
</head>
<body>
    <form id="formulario">
        <p>¿Deseas más información?:</p>

        <input type="radio" id="elige_si" name="elige" value="Si" onchange="mostrar()">
        <label for="elige_si">Sí, deseo más información</label><br>

        <input type="text" id="mas_info" name="mas_info" style="display:none;"><br>

        <input type="radio" id="elige_no" name="elige" value="No" onchange="mostrar()">
        <label for="elige_no">No, gracias</label><br>

        <span id="aviso" style="display:none; color:red;">
            ¿De verdad no deseas más información?
        </span>
    </form>
    <script src="ExamenJs.js"></script>
</body>
</html>

<!--He cambiado los ids de los input para que me sea mas facil hacer la actividad, a parte he añadido onchange="mostrar()" para que la llame cuando estos elementos se cambian-->
